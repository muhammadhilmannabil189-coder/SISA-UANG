
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SisaUang - Keuangan Pribadi</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Sisa Uang Mahasigma</h1>
        <p>Catat uangmu, kendalikan pengeluaranmu.</p>
    </header>

    <main>
        <!-- Ringkasan Keuangan -->
        <section class="ringkasan">
            <div class="kartu">
                <h3>Uang Tersedia</h3>
                <p id="saldo">Rp0</p>
            </div>

            <div class="kartu">
                <h3>Total Pemasukan</h3>
                <p id="pemasukan">Rp0</p>
            </div>

            <div class="kartu">
                <h3>Total Pengeluaran</h3>
                <p id="pengeluaran">Rp0</p>
            </div>

            <div class="kartu">
                <h3>Saldo Platform</h3>
                <p id="saldo-platform">Rp0</p>
            </div>
        </section>

        <!-- Form Tambah Transaksi -->
        <section class="form-transaksi">
            <h2>Tambah Transaksi</h2>

            <form id="form-transaksi">
                <label for="jenis">Jenis Transaksi</label>
                <select id="jenis" required>
                    <option value="pemasukan">Pemasukan</option>
                    <option value="pengeluaran">Pengeluaran</option>
                    <option value="tarik">Tarik Saldo Platform</option>
                </select>

                <label for="jumlah">Jumlah Uang (Rp)</label>
                <input
                    type="text"
                    id="jumlah"
                    inputmode="numeric"
                    placeholder="Contoh: 10.000"
                    autocomplete="off"
                    required
                >

                <label for="kategori">Kategori</label>
                <select id="kategori" required>
                    <option value="Uang Kuliah">Uang Kuliah</option>
                    <option value="Makan">Makan</option>
                    <option value="Transportasi">Transportasi</option>
                    <option value="Kebutuhan">Kebutuhan</option>
                    <option value="Hiburan">Hiburan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>

                <label for="sumber">Sumber / Keterangan</label>
                <input
                    type="text"
                    id="sumber"
                    placeholder="Contoh: Uang mingguan atau Sociabuzz"
                >

                <label for="tanggal">Tanggal</label>
                <input type="date" id="tanggal" required>

                <button type="submit">Simpan Transaksi</button>
            </form>
        </section>

        <!-- Riwayat Transaksi -->
        <section class="riwayat">
            <h2>Riwayat Transaksi</h2>

            <input
                type="search"
                id="pencarian"
                placeholder="Cari transaksi..."
            >

            <div class="tabel-container">
                <table>
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Jenis</th>
                            <th>Kategori</th>
                            <th>Keterangan</th>
                            <th>Jumlah</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="daftar-transaksi">
                        <!-- Transaksi akan ditampilkan oleh JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sisa Uang Mahasigma - Pengelola Keuangan Pribadi</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
